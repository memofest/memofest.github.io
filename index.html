<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메모페스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Pretendard', sans-serif;
      background: #F5F5F5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1A1A1A;
    }
    .card {
      background: #FAFAFA;
      border: 1.5px solid #1A1A1A;
      border-radius: 24px;
      padding: 40px 28px 32px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .icon { font-size: 40px; margin-bottom: 20px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 14px; line-height: 1.4; }
    .desc { font-size: 14px; color: rgba(26,26,26,0.55); line-height: 1.75; margin-bottom: 10px; }
    .sorry { font-size: 13px; color: rgba(26,26,26,0.38); line-height: 1.7; margin-bottom: 32px; }
    .divider { width: 100%; height: 1px; background: rgba(26,26,26,0.08); margin: 28px 0; }
    .btn {
      width: 100%;
      background: #1A1A1A;
      color: #FAFAFA;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .insta {
      margin-top: 16px;
      font-size: 13px;
      color: rgba(26,26,26,0.4);
      text-decoration: none;
      line-height: 1.6;
    }
    .insta:hover { color: rgba(26,26,26,0.65); }
    .btn-secondary {
      margin-top: 10px;
      background: transparent;
      color: #1A1A1A;
      border: 1.5px solid #1A1A1A;
    }
    /* 앱스토어 출시 전에는 누를 수 없는 상태로 둔다. 출시 후 a 태그와 링크로 바꾼다. */
    .btn-disabled {
      margin-top: 10px;
      background: rgba(26,26,26,0.06);
      color: rgba(26,26,26,0.38);
      cursor: default;
    }
    .legal {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(26,26,26,0.35);
      text-decoration: none;
    }
    .legal:hover { color: rgba(26,26,26,0.6); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1 class="title">메모페스트를<br>앱에서 만나요</h1>
    <p class="desc">
      토스 미니앱에서 바로 시작할 수 있어요.<br>
      아이폰 앱도 곧 출시돼요.
    </p>
    <div class="divider"></div>
    <p class="sorry">
      예전에 웹에서 기록하셨던 데이터는<br>
      안타깝게도 옮겨드리기 어려워요. 😢<br>
      불편을 드려서 정말 죄송해요.
    </p>
    <a class="btn" href="https://minion.toss.im/xueqBwPf">
      토스에서 메모페스트 열기
    </a>
    <!-- 앱스토어 출시 후: 아래 span을
         <a class="btn btn-secondary" href="(앱스토어 링크)">App Store에서 받기</a> 로 바꾸고,
         위 설명의 "아이폰 앱도 곧 출시돼요."를 "아이폰 앱으로도 만날 수 있어요."로 바꾼다. -->
    <span class="btn btn-disabled" aria-disabled="true">App Store · 곧 출시</span>
    <a class="insta" href="https://instagram.com/roxieoneway" target="_blank" rel="noopener">
      📸 @roxieoneway<br>업데이트 소식은 인스타 하이라이트에서 확인하세요
    </a>
    <a class="legal" href="/privacy">개인정보 처리방침</a>
  </div>
</body>
</html>
